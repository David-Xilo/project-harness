# project.toml: every value a new super project needs, in one file.
#
#   sp-new --check project.toml   check it and print what it describes
#   sp-new project.toml           create the root from it (PROJECTS_DIR/<dir>, which must not exist)
#   sp-new --modules <root>       after O1 creates the repositories: fill each module
#
# The /new-project command asks you these questions and writes this file for you; you can also
# copy this example and edit it. Text values are Markdown. Names, IDs and other short values
# are one line, and those that land in a table cell may not hold a "|". After setup the docs
# win: this file stays in <root>/.claude/project.toml as the record of the setup, and nothing
# reads it again except `sp-new --modules`.

[project]
name = "Weatherdesk"                 # display name
dir = "weatherdesk"                  # root folder name, under PROJECTS_DIR (sp-config)
owner = "example-org"                # GitHub owner of the root and module repositories
# root = "~/projects/weatherdesk"    # only when the root goes somewhere else
# date = "2026-10-11"                # the setup date; default today (modules take the day they are filled)
summary = "Weatherdesk collects readings from home weather stations, keeps every reading, and shows them on a dashboard."
vision = """
Weatherdesk turns a few home weather stations into a trustworthy local record: every reading
is captured once, stored with its source and time, and can be replayed or charted later.
"""
# Scale, users, hosts, languages, budgets and what is deferred; one bullet each.
defaults = [
  "One household, one Linux host, up to five stations.",
  "Go for services; no cloud services.",
  "Alerts and forecasts are deferred.",
]
language = "Go"                      # root .gitignore language
v1_milestone = "M2"                  # first unattended production use: that milestone is v1.0.0
domain_invariants = "reading times in UTC, the source of every reading"   # in the Common working rules
private_data = "station locations"   # never exposed in logs, evidence or a public repository
never_exported = "station locations and captured readings"   # completes "Credentials, … never go into it" (a public module)
diagram = """
  S[stations] --> C[collector] --> D[(store)] --> V[dashboard]
"""
layers = [
  "**Collector** (`COL`): polls each station and hands raw readings to the store.",
  "**Store** (`STO`): keeps every reading with its source and time; answers range queries.",
]
glossary_groups = ["Weather data"]   # glossary sections; the codes section is always added
hard_rules = [                       # optional: extra "Always" rules for every session
  "Captured readings never leave the host.",
]

# Rules every module follows: one group per heading.
[[rules]]
group = "Data"
items = [
  "Times are UTC with an explicit offset; never local time.",
  "A reading is never changed after it is stored; a correction is a new reading.",
]

# Optional: a stack or host service only one session may run. Remove the section if there is none.
[runtime]
name = "the Docker stack (`deskctl.sh`)"
session = "S2"
monitoring = "the collector's last poll per station and the store's write rate."
# Optional: the scripts only that session (and CP<m> during its run) may run. sp-new writes the
# rule to .claude/workspace.json, which the workspace mod enforces. "free" subcommands and
# "docker_free" docker subcommands anyone may run; "commit_first" lists the repositories that
# must be committed before a subcommand runs.
scripts = ["deskctl.sh"]
free = ["status"]
docker_free = ["ps", "logs"]
commit_first = [{ command = "build", repos = ["weatherdesk-collector", "weatherdesk-store"] }]
[[runtime.checks]]
check = "A station that stops reporting is seen within 10 minutes"
how = "`deskctl.sh status` lists each station's last reading time."

# Tracks: each is the only writer of its modules' repositories. IDs T1, T2, … in order.
[[tracks]]
id = "T1"
name = "Collection"

[[tracks]]
id = "T2"
name = "Storage"

# Optional: sessions S1, S2, … (at most four), each holding one or more tracks.
# Without this, each track gets its own session.
[[sessions]]
id = "S1"
name = "Collector"
tracks = ["T1"]

[[sessions]]
id = "S2"
name = "Store"
tracks = ["T2"]

# Milestones M1, M2, … in order. Each has a gate and acceptance criteria.
[[milestones]]
id = "M1"
title = "First readings"
delivers = "Readings from one station are captured and stored."
goal = "One station's readings reach the store every minute, with source and time."
capabilities = "`deskctl.sh up`; `weatherdesk-store query --station <id> --since <time>`."
goals = ["Capture one station's readings every minute.", "Store each reading with its source and UTC time."]
gate = { name = "readings", artifact = "a day of stored readings from one station" }
[[milestones.acceptance]]
criterion = "A day of readings is stored."
how = "`weatherdesk-store query --since -24h` returns at least 1,400 readings from the test station."

[[milestones]]
id = "M2"
title = "Dashboard"
delivers = "A local dashboard charts every station."
goal = "The household reads current and past weather on a local page."
capabilities = "The dashboard at http://localhost:8080."
goals = ["Chart the last week for every station."]
gate = { name = "dashboard", artifact = "the dashboard serving a week of data" }
[[milestones.acceptance]]
criterion = "The dashboard shows a week."
how = "Open the page; each station shows seven days."

# Modules that M1 needs: each becomes a repository (and a git submodule) at O1.
# Step IDs are <CODE>-<milestone>.<n>; depends names other step IDs.
[[modules]]
code = "COL"
name = "Collector"
repo = "weatherdesk-collector"
owns = "polling stations and raw readings"
track = "T1"
description = "Polls home weather stations and hands their readings to the store."
purpose = "Turn each station's report into a reading with its source and UTC time."
boundaries = ["Talks to stations and to the store's write API only."]
never_does = "Never writes the store's database directly."
invariants = ["Every reading carries its station ID and capture time."]
checks = """
go vet ./...
go test ./...
"""
setup = "go build ./..."
# usage = "..."                      # leave out until something is delivered
exit_criteria = "A day of readings from one station reaches the store."
[[modules.steps]]
id = "COL-1.1"
title = "Poll one station and print its readings"
definition = "Poll one station every minute and print each reading as JSON with its source and UTC time; checked against a recorded station reply"
[[modules.steps]]
id = "COL-1.2"
title = "Send readings to the store"
depends = ["COL-1.1", "STO-1.1"]

[[modules]]
code = "STO"
name = "Store"
repo = "weatherdesk-store"
owns = "stored readings and range queries"
track = "T2"
description = "Keeps every reading with its source and time and answers range queries."
purpose = "Be the one writer and reader of stored readings."
boundaries = ["Owns the readings database; others go through its API."]
never_does = "Never polls stations."
invariants = ["Stored readings are never changed."]
checks = """
go vet ./...
go test ./...
"""
setup = "go build ./..."
exit_criteria = "Range queries return what was written."
[[modules.steps]]
id = "STO-1.1"
title = "Write API and storage"
[[modules.steps]]
id = "STO-1.2"
title = "Range query CLI"
depends = ["STO-1.1"]
[[modules.steps]]
id = "STO-2.1"
title = "Range query API for the dashboard"
priority = "P1"

# Optional: modules a later milestone needs. Their repository is made with their first step.
# When an O task creates it, move the module to [[modules]] in <root>/.claude/project.toml,
# with the keys a module needs, and run `sp-new --modules <root>` again: it fills only the
# new repository.
[[future_modules]]
code = "VIEW"
name = "Dashboard"
repo = "weatherdesk-dashboard"
owns = "the dashboard page"
track = "T2"
created_at = "M2"
waits_for = "G1-readings"
[[future_modules.steps]]
id = "VIEW-2.1"
title = "Chart a week per station"
depends = ["STO-2.1"]
