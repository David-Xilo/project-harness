name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # leak-check --history reads every commit
          persist-credentials: false

      - name: Install gitleaks and Claude Code
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          # The version the mods are written against; older builds do not load the workspace mod.
          CLAUDE_CODE_VERSION: 2.1.296
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          rm gitleaks.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -S warning $(grep -lE '^#!.*\b(ba)?sh\b' tooling/install tooling/bin/* tooling/hooks/* tooling/git-hooks/* tooling/tests/*/*.sh)

      - name: sp-new tests
        run: tooling/tests/sp-new/run.sh

      - name: leak-check tests
        run: tooling/tests/leak-check/run.sh

      - name: publish-check tests
        run: tooling/tests/publish-check/run.sh

      - name: sp-claude-init tests
        run: tooling/tests/sp-claude-init/run.sh

      - name: Mod tests
        run: |
          claude plugin test tooling/mods/session-reset
          claude plugin test tooling/mods/workspace

      - name: gitleaks over the tree and the history
        run: |
          tooling/bin/leak-check
          tooling/bin/leak-check --history
